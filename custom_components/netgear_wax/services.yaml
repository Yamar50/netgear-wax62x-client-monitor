wifi_scan_probe:
  name: Check local Wi-Fi scan capability
  description: Administrator-only Linux feasibility test. Requests one passive scan per local wireless interface using existing permissions. Returns hashed identifiers and scan age; never changes links, channels, AP settings or polling. Wait two minutes between runs.

set_hostname:
  fields:
    mac:
      required: true
      example: "02:00:00:00:00:01"
      selector:
        text:
    hostname:
      required: true
      example: "Family phone"
      selector:
        text:
